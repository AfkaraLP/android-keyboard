name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      # versionCode and versionName come from the commit history and tags, so a
      # depth-1 clone won't do. A treeless clone gets those for a few MB instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # Not done by actions/checkout because fetch-depth: 0 would also apply to
      # submodules, and it wouldn't fetch LFS files inside them.
      - name: Fetch submodules
        run: git submodule update --init --recursive --depth 1 --jobs 4

      # A missing LFS file doesn't fail the build: the pointer file is packaged
      # as the swipe model instead, so check for leftover pointers explicitly.
      - name: Fetch swipe models from LFS
        working-directory: java/assets/futo-swipe
        run: |
          git lfs install --local
          git lfs pull
          if grep -rlI --exclude-dir=.git '^version https://git-lfs' .; then
            echo "::error::Files above are still LFS pointers"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android SDK
        run: |
          ndk_version=$(sed -n "s/^ *ndkVersion '\(.*\)'/\1/p" build.gradle)
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Platforms:   $(ls "$ANDROID_HOME/platforms" | xargs)"
          echo "Build tools: $(ls "$ANDROID_HOME/build-tools" | xargs)"
          echo "NDK:         $(ls "$ANDROID_HOME/ndk" | xargs)"
          echo "CMake:       $(ls "$ANDROID_HOME/cmake" | xargs)"

          missing=()
          for package in "platforms;android-35" "build-tools;35.0.0" "ndk;$ndk_version" "cmake;3.22.1"; do
            if [ ! -d "$ANDROID_HOME/${package/;//}" ]; then
              missing+=("$package")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Installing: ${missing[*]}"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "${missing[@]}" < <(yes) > /dev/null
          else
            echo "All required SDK components are preinstalled"
          fi

      # Same scheme as .gitlab-ci.yml. The app adds its own "v" to the version
      # name, and update checks treat anything but "master" as a dev branch.
      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version_name=${GITHUB_REF_NAME#v}
            branch_name=master
          else
            version_name=$(git describe --tags)
            version_name=${version_name#v}
            branch_name=$GITHUB_REF_NAME
          fi
          {
            echo "VERSION_NAME=$version_name"
            echo "VERSION_CODE=$(git rev-list --first-parent --count HEAD)"
            echo "BRANCH_NAME=$branch_name"
          } | tee -a "$GITHUB_ENV"

      # gradle.properties limits the heap to suit small machines, which is too
      # tight for R8 when the runner has memory to spare.
      - name: Build
        run: >
          ./gradlew assembleStableRelease
          --no-daemon --parallel --build-cache
          "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"

      - name: Check APK
        run: |
          apk=futo-keyboard-$VERSION_NAME-stable.apk
          mv build/outputs/apk/stable/release/*-stable-release.apk "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

          build_tools=$ANDROID_HOME/build-tools/35.0.0
          "$build_tools/aapt2" dump badging "$apk" | head -n 1
          "$build_tools/apksigner" verify --print-certs "$apk"
          ls -lh "$apk"

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          if-no-files-found: error
          compression-level: 0

      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
